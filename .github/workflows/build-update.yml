
name: Build Collection Manager Update

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  build-update:
    runs-on: windows-latest

    steps:
      - name: Check out release
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event.release.tag_name }}

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24

      - name: Install production dependencies
        working-directory: backend
        run: npm ci --omit=dev

      - name: Prepare application package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path "update/application/backend"
          New-Item -ItemType Directory -Force -Path "update/application/frontend"

          # Copy backend, including the newly installed node_modules
          Get-ChildItem -LiteralPath "backend" -Force |
            Copy-Item -Destination "update/application/backend" -Recurse -Force

          # Copy frontend
          Get-ChildItem -LiteralPath "frontend" -Force |
            Copy-Item -Destination "update/application/frontend" -Recurse -Force

          # Create version information
          $Version = $env:GITHUB_REF_NAME.TrimStart("v")
          $ReleaseDate = (Get-Date).ToUniversalTime().ToString("yyyy-MM-dd")

          @{
            version = $Version
            releaseDate = $ReleaseDate
          } | ConvertTo-Json | Set-Content "update/application/version.json"

      - name: Download portable Node.js runtime
        shell: pwsh
        run: |
          $NodeVersion = "v24.15.0"
          $Archive = "node-$NodeVersion-win-x64.zip"
          $Url = "https://nodejs.org/dist/$NodeVersion/$Archive"

          Invoke-WebRequest -Uri $Url -OutFile $Archive

          Expand-Archive -Path $Archive -DestinationPath "node-extracted"

          New-Item -ItemType Directory -Force -Path "update/runtime/node"

          Copy-Item `
            "node-extracted/node-$NodeVersion-win-x64/node.exe" `
            "update/runtime/node/node.exe"

      - name: Download portable MySQL runtime
        shell: pwsh
        run: |
          $MySQLVersion = "8.4.13"
          $Archive = "mysql-$MySQLVersion-winx64.zip"
          $Url = "https://dev.mysql.com/get/Downloads/MySQL-8.4/$Archive"

          Invoke-WebRequest -Uri $Url -OutFile $Archive

          Expand-Archive -Path $Archive -DestinationPath "mysql-extracted"

          New-Item -ItemType Directory -Force -Path "update/runtime/mysql"

          Get-ChildItem -LiteralPath "mysql-extracted/mysql-$MySQLVersion-winx64" -Force |
            Copy-Item -Destination "update/runtime/mysql" -Recurse -Force

      - name: Include database setup file
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path "update/database"

          Copy-Item `
            "game_collection.sql" `
            "update/database/game_collection.sql"

        - name: Create ZIP
        shell: pwsh
        run: |
          Compress-Archive `
            -Path "update/application", "update/runtime", "update/database" `
            -DestinationPath "CollectionManager-$env:GITHUB_REF_NAME.zip" `
            -CompressionLevel Optimal

      - name: Attach ZIP to release
        uses: softprops/action-gh-release@v2
        with:
          files: CollectionManager-*.zip
