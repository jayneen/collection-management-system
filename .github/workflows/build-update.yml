
name: Build Collection Manager Update

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  build-update:
    runs-on: ubuntu-latest

    steps:
      - name: Check out release
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name }}

      - name: Prepare application package
        shell: bash
        run: |
          mkdir -p update/application

          cp -r backend update/application/
          cp -r frontend update/application/

          # Remove development dependencies for now
          rm -rf update/application/backend/node_modules

          cat > update/application/version.json << EOF
          {
            "version": "${GITHUB_REF_NAME#v}",
            "releaseDate": "$(date -u +%Y-%m-%d)"
          }
          EOF

      - name: Create ZIP
        run: |
          cd update
          zip -r "../CollectionManager-${GITHUB_REF_NAME}.zip" application

      - name: Attach ZIP to release
        uses: softprops/action-gh-release@v2
        with:
          files: CollectionManager-*.zip
