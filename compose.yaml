services:
  db:
    image: mysql:8.4
    container_name: collection-db
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
      MYSQL_DATABASE: game_collection
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./game_collection.sql:/docker-entrypoint-initdb.d/game_collection.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -P 3306 -u root -p\"$${MYSQL_ROOT_PASSWORD}\" --silent"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 30s

  backend:
    build: ./backend
    container_name: collection-backend
    restart: unless-stopped
    ports:
      - "2000:2000"
    volumes:
      - ./frontend:/frontend:ro
    environment:
      PORT: 2000
      DB_HOST: db
      DB_USERNAME: root
      DB_PASSWORD: ${DB_ROOT_PASSWORD}
      FRONTEND_PATH: /frontend
    depends_on:
      db:
        condition: service_healthy

volumes:
  mysql_data:
