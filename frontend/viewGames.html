<!DOCTYPE html>
<html lang="en">

<body>

    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <title>View Games</title>
        <link href="css/bootstrap.min.css" rel="stylesheet">
        <link href="css/styles.css" rel="stylesheet">
    </head>

    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script src="js/menu.js"></script>
    <script src="js/components.js"></script>

    <div data-include="components/navigation.html"></div>

    <div class="container">
        <div data-include="components/viewNav.html"></div>

        <h4>View All Games</h4>
        <input type="text" id="search" class="form-control mb-3" placeholder="Search by name...">
        <table class="table" id="tbl">
            <thead>
                <tr>
                    <th>UID</th>
                    <th>Game Name</th>
                    <th>Region</th>
                    <th>Condition</th>
                    <th>Notes</th>
                    <th>Actions</th>
                </tr>
            </thead>
            <tbody></tbody>
        </table>

        <div id="delMsg"></div>

        <!-- Delete confirmation modal -->
        <div class="modal fade" id="delModal" tabindex="-1">
            <div class="modal-dialog">
                <div class="modal-content">
                    <div class="modal-header">
                        <h4 class="modal-title" id="delModalLabel">Confirm Deletion</h4><button type="button"
                            class="close" data-dismiss="modal">&times;</button>
                    </div>
                    <div class="modal-body" id="modalMessage"></div>
                    <div class="modal-footer">
                        <button type="button" class="btn btn-secondary" data-dismiss="modal">Cancel</button>
                        <button id="confirmDel" type="button" class="btn btn-danger">Delete</button>
                    </div>
                </div>
            </div>
        </div>



    </div>
    <footer></footer>
    <script src="js/viewGames.js"></script>
</body>

</html>
