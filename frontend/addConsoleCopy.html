<!DOCTYPE html>
<html lang="en">

<body>

    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <title>Add Console Copy</title>
        <link href="css/bootstrap.min.css" rel="stylesheet">
        <link href="css/styles.css" rel="stylesheet">
    </head>

    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script src="js/menu.js"></script>
    <script src="js/components.js"></script>

    <div data-include="components/navigation.html"></div>
    <div data-include="components/addNav.html"></div>

    <h4>Add a Console Copy</h4>
    <form id="create-form">
        <!-- Model Name Selector -->
        <div class="form-group">
            <label for="modelName">Model Name</label>
            <select class="form-control" name="modelName" id="modelNameSelect">
                <option value="">Select model name</option>
            </select>
        </div>

        <!-- Region -->
        <div class="form-group">
            <label for="regionInput">Region</label>
            <input type="text" class="form-control" id="regionInput" name="region" placeholder="Enter a region">
        </div>

        <!-- Condition Selector -->
        <div class="form-group">
            <label for="condition">Condition</label>
            <select class="form-control" name="condition" id="conditionSelect">
                <option value="">Select condition</option>
            </select>
        </div>

        <!-- Seal or CIB Selector -->
        <div class="form-group">
            <label for="sealOrCIB">Seal or CIB</label>
            <select class="form-control" name="sealOrCIB" id="sealOrCIBSelect">
                <option value="">Select option</option>
            </select>
        </div>

        <!-- Notes -->
        <div class="form-group">
            <label for="notesInput">Notes</label>
            <textarea class="form-control" id="notesInput" name="notes" rows="4"
                placeholder="Enter notes here..."></textarea>
        </div>

        <button type="submit" class="btn btn-success">Add Console</button>
    </form>
    <div id="create-msg"></div>
    <script src="js/addConsoleCopy.js"></script>

    </div>
    <footer></footer>
</body>

</html>
